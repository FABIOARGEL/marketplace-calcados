{% extends 'sellers/base.html' %}
{% block title %}Senha alterada — SoleStep{% endblock %}
{% block breadcrumb %}Senha Alterada{% endblock %}
{% block content %}
<div class="panel-card" style="max-width:500px;">
  <div class="panel-card__body" style="text-align:center;padding:var(--space-10);">
    <div style="width:56px;height:56px;margin:0 auto var(--space-4);display:flex;align-items:center;justify-content:center;background:rgba(26,140,78,0.1);border:2px solid var(--color-success);color:var(--color-success);">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h1 style="font-family:var(--font-heading);font-size:var(--text-2xl);font-weight:800;margin-bottom:var(--space-3);">Senha alterada!</h1>
    <p style="font-family:var(--font-body);color:var(--color-muted);margin-bottom:var(--space-6);">Sua senha foi atualizada com sucesso.</p>
    <a href="{% url 'sellers:settings' %}" class="btn-panel btn-panel--accent" id="btn-back-settings">&larr; Voltar às configurações</a>
  </div>
</div>
{% endblock %}
